[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cs2308-medical-rag"
version = "0.1.0"
description = "Reproducible Vietnamese medical QA PiSSA + RAG ablation pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.11,<1.12",
  "bert-score>=0.3.13,<0.4",
  "datasets>=4.3,<4.4",
  "faiss-cpu>=1.12,<1.13",
  "hf-transfer>=0.1.9,<0.2",
  "huggingface-hub>=0.35,<0.37",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "peft>=0.17,<0.19",
  "py-vncorenlp>=0.1.4,<0.2",
  "PyYAML>=6,<7",
  "rank-bm25>=0.2.2,<0.3",
  "safetensors>=0.5,<0.7",
  "scikit-learn>=1.6,<1.8",
  "sentencepiece>=0.2,<0.3",
  "tensorboard>=2.18,<3",
  "tqdm>=4.67,<5",
  "transformers>=4.57,<4.58",
  "trl>=0.22,<0.23",
]

[project.scripts]
cs2308 = "cs2308.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cs2308"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
